name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Escaped as \${{ }} this was a constant string, so every run in the repo shared
  # one group and each new run cancelled all the others regardless of branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: every commit there must keep its own green record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # npm run check regenerates schemas/*.json from the zod source but never compares the
      # result with what is committed, so a zod upgrade or a schema edit could change the
      # published JSON Schemas and still pass. Every file in schemas/ is generated, so the step
      # deletes them all and regenerates from nothing. Regenerating over the old files would
      # leave a schema the generator no longer writes in place, and package.json ships the whole
      # folder. git status (not git diff) then reports a changed schema as M, a new output that
      # was never added as ??, and a committed schema the generator no longer writes as D.
      - name: Fail if regenerated JSON Schemas differ from the committed files
        run: |
          rm -f schemas/*.json
          npm run schema
          drift="$(git status --porcelain -- schemas/)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- schemas/
            echo "::error::schemas/ does not match the generator. Delete schemas/*.json, run npm run schema, and commit the result."
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
